        - id: p0
      ports:
        - id: p0_port
          type: flow
        - id: p1_port
          type: flow
        - id: p2_port
          type: flow
        - id: p3_port
          type: flow
        - id: p4_port
          type: flow
        - id: capacity_port
          type: capacity
        - id: expansion_volume_port
          type: capacity
        - id: expansion_cost_port
          type: capacity
      port-field-definitions:
        - port: p0_port
          field: power
          definition: rate0 * p0
        - port: p1_port
          field: power
          definition: efficiency * p0
        - port: p2_port
          field: power
          definition: efficiency2 * p0
        - port: p3_port
          field: power
          definition: efficiency3 * p0
        - port: p4_port
          field: power
          definition: efficiency4 * p0
        - port: capacity_port
          field: value
          definition: p_nom
        - port: expansion_volume_port
          field: value
          definition: length * p_nom
        - port: expansion_cost_port
          field: value
          definition: capital_cost * p_nom
      constraints:
        - id: p0_upper
          expression: p0 <= p_max_pu * p_nom
        - id: p0_lower
          expression: p0 >= p_min_pu * p_nom
        - id: ramp_up
          expression: ramp_up_active * (p0 - p0[t-1]) <= ramp_limit_up * p_nom
        - id: ramp_down
          expression: ramp_down_active * (p0 - p0[t-1]) >= -ramp_limit_down * p_nom
        - id: ramp_up_initial
          expression: p_init_active * ramp_up_active[0] * (p0[0] - p_init) <= ramp_limit_up[0] * p_nom
        - id: ramp_down_initial
          expression: p_init_active * ramp_down_active[0] * (p0[0] - p_init) >= -ramp_limit_down[0] * p_nom
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(objective_weighting * marginal_cost * p0)

    - id: storage_unit
      #Model for PyPSA storage unit with cyclic state of charge: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#storage-unit
      #Non-cyclic storage units use storage_unit_non_cyclic.
      parameters:
        #- id: control # Not used in DC LOPF
        #- id: type # This parameter is not used in the Gems model
        #- id: p_nom_mod # Not instantiated: modular expansion is rejected by the converter
        #- id: p_nom_extendable # Not used in the Gems model: p_nom_min and p_nom_max fix p_nom for non-extendable storage units
        #- id: p_nom_set # Handled by converter: p_nom_min = p_nom_max = p_nom_set for extendable storage units
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          # p_store <= -p_min_pu * p_nom (PyPSA default p_min_pu = -1)
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          # p_dispatch <= p_max_pu * p_nom
          time-dependent: true
          scenario-dependent: true
        #- id: p_set, p_dispatch_set, p_store_set, state_of_charge_set # Fixed operation: rejected by the converter
        #- id: q_set # No reactive power in DC LOPF
        - id: sign # default value = 1
          time-dependent: false
          scenario-dependent: false
        #- id: carrier # Used by the converter to connect the storage unit to global constraints
        - id: spill_cost
          time-dependent: true
          scenario-dependent: true
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic # Non-linear: rejected by the converter
        - id: marginal_cost_storage
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          # Periodized cost: capital_cost + fom_cost, or annuity(overnight_cost, discount_rate, lifetime) + fom_cost
          time-dependent: false
          scenario-dependent: false
        #- id: active # Not instantiated: the converter drops inactive components.
        #- id: build_year # Only used with investment periods, which are rejected
        #- id: lifetime # Only used with investment periods and overnight_cost
        #- id: state_of_charge_initial # Ignored by PyPSA when cyclic_state_of_charge = True
        #- id: state_of_charge_initial_per_period, cyclic_state_of_charge_per_period # Investment periods only
        - id: max_hours
          time-dependent: false
          scenario-dependent: false
        - id: efficiency_store
          time-dependent: true
          scenario-dependent: true
        - id: efficiency_dispatch
          time-dependent: true
          scenario-dependent: true
        - id: standing_efficiency
          # (1 - standing_loss)^hours_per_time_step, computed by the converter
          time-dependent: true
          scenario-dependent: true
        - id: inflow
          time-dependent: true
          scenario-dependent: true
        - id: emission_factor
          # Carrier attribute of a primary_energy global constraint. Cyclic storage units contribute nothing to it.
          time-dependent: false
          scenario-dependent: true
        - id: hours_per_time_step
          # Source: PyPSA n.snapshot_weightings.stores
          time-dependent: true
          scenario-dependent: false
        - id: objective_weighting
          # Source: PyPSA n.snapshot_weightings.objective
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p_store
          lower-bound: 0
          upper-bound: -p_min_pu * p_nom_max
        - id: p_dispatch
          lower-bound: 0
          upper-bound: p_max_pu * p_nom_max
        - id: state_of_charge
          lower-bound: 0
          upper-bound: max_hours * p_nom_max
        - id: spill
          lower-bound: 0
          upper-bound: inflow
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: sign * (p_dispatch - p_store)
        - port: emission_port
          field: emission
          definition: emission_factor * 0 # A cyclic storage unit ends where it starts: no primary energy contribution
        - port: capacity_port
          field: value
          definition: p_nom
      constraints:
        - id: p_store_upper
          expression: p_store <= -p_min_pu * p_nom
        - id: p_dispatch_upper
          expression: p_dispatch <= p_max_pu * p_nom
        - id: state_of_charge_upper
          expression: state_of_charge <= max_hours * p_nom
        - id: state_of_charge_balance
          expression: state_of_charge = standing_efficiency * state_of_charge[t-1] + hours_per_time_step * (efficiency_store * p_store - p_dispatch / efficiency_dispatch + inflow - spill)
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(objective_weighting * (marginal_cost * p_dispatch + spill_cost * spill + marginal_cost_storage * state_of_charge))

    - id: storage_unit_non_cyclic
      #Model for PyPSA storage unit with cyclic_state_of_charge = False.
      #state_of_charge_balance is declared with `out-of-bounds-processing: drop`, and the first time step starts from
      #state_of_charge_initial (no standing loss applied to it, as in PyPSA).
      #is_last_time_step (1 at the last time step, else 0) gives the final state of charge to the global constraints:
      #a non-cyclic storage unit contributes (state_of_charge_initial - final state of charge) to them, as in PyPSA.
      parameters:
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: sign
          time-dependent: false
          scenario-dependent: false
        - id: spill_cost
          time-dependent: true
          scenario-dependent: true
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        - id: marginal_cost_storage
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: max_hours
          time-dependent: false
          scenario-dependent: false
        - id: efficiency_store
          time-dependent: true
          scenario-dependent: true
        - id: efficiency_dispatch
          time-dependent: true
          scenario-dependent: true
        - id: standing_efficiency
          time-dependent: true
          scenario-dependent: true
        - id: inflow
          time-dependent: true
          scenario-dependent: true
        - id: emission_factor
          time-dependent: false
          scenario-dependent: true
        - id: hours_per_time_step
          time-dependent: true
          scenario-dependent: false
        - id: objective_weighting
          time-dependent: true
          scenario-dependent: false
        - id: state_of_charge_initial
          time-dependent: false
          scenario-dependent: true
        - id: is_last_time_step
          # Shared series: 1 at the last time step of the horizon, 0 elsewhere
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p_store
          lower-bound: 0
          upper-bound: -p_min_pu * p_nom_max
        - id: p_dispatch
          lower-bound: 0
          upper-bound: p_max_pu * p_nom_max
        - id: state_of_charge
          lower-bound: 0
          upper-bound: max_hours * p_nom_max
        - id: spill
          lower-bound: 0
          upper-bound: inflow
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        - id: operational_port
          type: quantity
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: sign * (p_dispatch - p_store)
        - port: emission_port
          field: emission
          definition: emission_factor * is_last_time_step * (state_of_charge_initial - state_of_charge)
        - port: operational_port
          field: value
          definition: is_last_time_step * (state_of_charge_initial - state_of_charge)
        - port: capacity_port
          field: value
          definition: p_nom
      constraints:
        - id: p_store_upper
          expression: p_store <= -p_min_pu * p_nom
        - id: p_dispatch_upper
          expression: p_dispatch <= p_max_pu * p_nom
        - id: state_of_charge_upper
          expression: state_of_charge <= max_hours * p_nom
        - id: state_of_charge_balance
          expression: state_of_charge = standing_efficiency * state_of_charge[t-1] + hours_per_time_step * (efficiency_store * p_store - p_dispatch / efficiency_dispatch + inflow - spill)
        - id: state_of_charge_initial_balance
          expression: state_of_charge[0] = state_of_charge_initial + hours_per_time_step[0] * (efficiency_store[0] * p_store[0] - p_dispatch[0] / efficiency_dispatch[0] + inflow[0] - spill[0])
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(objective_weighting * (marginal_cost * p_dispatch + spill_cost * spill + marginal_cost_storage * state_of_charge))

    - id: store
      #Model for PyPSA store with e_cyclic = True: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#store
      #Non-cyclic stores use store_non_cyclic.
      parameters:
        #- id: type # This parameter is not used in the Gems model
        #- id: carrier # Used by the converter to connect the store to global constraints
        #- id: e_nom_mod # Not instantiated: modular expansion is rejected by the converter
        #- id: e_nom_extendable # Not used in the Gems model: e_nom_min and e_nom_max fix e_nom for non-extendable stores
        #- id: e_nom_set # Handled by converter: e_nom_min = e_nom_max = e_nom_set for extendable stores
        - id: e_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: e_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: e_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: e_max_pu
          time-dependent: true
          scenario-dependent: true
        #- id: e_initial # Ignored by PyPSA when e_cyclic = True
        #- id: e_initial_per_period, e_cyclic_per_period # Investment periods only
        #- id: p_set, e_set # Fixed operation: rejected by the converter
        #- id: q_set # No reactive power in DC LOPF
        - id: sign # default value = 1
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic # Non-linear: rejected by the converter
        - id: marginal_cost_storage
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          # Periodized cost: capital_cost + fom_cost, or annuity(overnight_cost, discount_rate, lifetime) + fom_cost
          time-dependent: false
          scenario-dependent: false
        - id: standing_efficiency
          # (1 - standing_loss)^hours_per_time_step, computed by the converter
          time-dependent: true
          scenario-dependent: true
        #- id: active # Not instantiated: the converter drops inactive components.
        #- id: build_year # Only used with investment periods, which are rejected
        #- id: lifetime # Only used with investment periods and overnight_cost
        - id: emission_factor
          # Carrier attribute of a primary_energy global constraint. Cyclic stores contribute nothing to it.
          time-dependent: false
          scenario-dependent: true
        - id: hours_per_time_step
          # Source: PyPSA n.snapshot_weightings.stores
          time-dependent: true
          scenario-dependent: false
        - id: objective_weighting
          # Source: PyPSA n.snapshot_weightings.objective
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: e_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: e_nom_min
          upper-bound: e_nom_max
        - id: e
        - id: p
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: sign * p
        - port: emission_port
          field: emission
          definition: emission_factor * 0 # A cyclic store ends where it starts: no primary energy contribution
        - port: capacity_port
          field: value
          definition: e_nom
      constraints:
        - id: e_upper
          expression: e <= e_max_pu * e_nom
        - id: e_lower
          expression: e >= e_min_pu * e_nom
        - id: energy_balance
          expression: e = standing_efficiency * e[t-1] - hours_per_time_step * p
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * e_nom
        - id: operational_objective
          expression: sum(objective_weighting * (marginal_cost * p + marginal_cost_storage * e))

    - id: store_non_cyclic
      #Model for PyPSA store with e_cyclic = False (PyPSA's default), e.g. the PyPSA-Eur "co2 atmosphere" store.
      #energy_balance is declared with `out-of-bounds-processing: drop`, and the first time step starts from e_initial
      #(no standing loss applied to it, as in PyPSA).
      #is_last_time_step (1 at the last time step, else 0) gives the final energy level to the global constraints:
      #  - primary_energy and operational_limit: (e_initial - final level), as in PyPSA
      #  - co2_atmosphere (PyPSA-Eur): final level
      parameters:
        - id: e_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: e_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: e_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: e_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: sign
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        - id: marginal_cost_storage
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: standing_efficiency
          time-dependent: true
          scenario-dependent: true
        - id: emission_factor
          time-dependent: false
          scenario-dependent: true
        - id: hours_per_time_step
          time-dependent: true
          scenario-dependent: false
        - id: objective_weighting
          time-dependent: true
          scenario-dependent: false
        - id: e_initial
          time-dependent: false
          scenario-dependent: true
        - id: is_last_time_step
          # Shared series: 1 at the last time step of the horizon, 0 elsewhere
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: e_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: e_nom_min
          upper-bound: e_nom_max
        - id: e
        - id: p
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        - id: operational_port
          type: quantity
        - id: final_level_port
          type: quantity
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: sign * p
        - port: emission_port
          field: emission
          definition: emission_factor * is_last_time_step * (e_initial - e)
        - port: operational_port
          field: value
          definition: is_last_time_step * (e_initial - e)
        - port: final_level_port
          field: value
          definition: is_last_time_step * e
        - port: capacity_port
          field: value
          definition: e_nom
      constraints:
        - id: e_upper
          expression: e <= e_max_pu * e_nom
        - id: e_lower
          expression: e >= e_min_pu * e_nom
        - id: energy_balance
          expression: e = standing_efficiency * e[t-1] - hours_per_time_step * p
        - id: initial_energy_balance
          expression: e[0] = e_initial - hours_per_time_step[0] * p[0]
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * e_nom
        - id: operational_objective
          expression: sum(objective_weighting * (marginal_cost * p + marginal_cost_storage * e))

    #### Models for PyPSA global constraints: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#global-constraint ###
    # One model per sense (<=, ==, >=). The converter connects each global constraint to the ports of the components
    # PyPSA includes in it.

    - id: global_constraint_co2_max
      # PyPSA primary_energy global constraint, sense <=:
      #   sum over generators of p / efficiency * hours * carrier attribute
      #   + sum over non-cyclic stores and storage units of (initial - final level) * carrier attribute <= constant
      # The carrier attribute is co2_emissions by default (any single attribute is supported, through emission_factor).
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: emission_port
          type: emission
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(emission_port.emission)) <= quota

    - id: global_constraint_co2_eq
      # PyPSA primary_energy global constraint, sense ==. See global_constraint_co2_max.
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: emission_port
          type: emission
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(emission_port.emission)) = quota

    - id: global_constraint_co2_min
      # PyPSA primary_energy global constraint, sense >=. See global_constraint_co2_max.
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: emission_port
          type: emission
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(emission_port.emission)) >= quota

    - id: global_constraint_quantity_max
      # Sum over the horizon of time-dependent quantities, sense <=. Used for:
      #   - PyPSA operational_limit: energy of the generators of the carrier + (initial - final level) of the
      #     non-cyclic stores and storage units of the carrier (operational_port)
      #   - PyPSA-Eur co2_atmosphere: final level of the non-cyclic stores on buses whose carrier has a non-zero
      #     carrier attribute (final_level_port)
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: quantity_port
          type: quantity
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(quantity_port.value)) <= quota

    - id: global_constraint_quantity_eq
      # Sense ==. See global_constraint_quantity_max.
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: quantity_port
          type: quantity
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(quantity_port.value)) = quota

    - id: global_constraint_quantity_min
      # Sense >=. See global_constraint_quantity_max.
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: quantity_port
          type: quantity
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(quantity_port.value)) >= quota

    - id: global_constraint_capacity_max
      # Sum of time-independent capacity terms, sense <=. Used for:
      #   - PyPSA transmission_volume_expansion_limit: length * capacity of extendable lines and links (expansion_volume_port)
      #   - PyPSA transmission_expansion_cost_limit: capital_cost * capacity of extendable lines and links (expansion_cost_port)
      #   - PyPSA tech_capacity_expansion_limit and bus nom_max_<carrier>: capacity of extendable components (capacity_port)
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: capacity_port
          type: capacity
      binding-constraints:
        - id: constraint_expression
          expression: sum_connections(capacity_port.value) <= quota

    - id: global_constraint_capacity_eq
      # Sense ==. See global_constraint_capacity_max.
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: capacity_port
          type: capacity
      binding-constraints:
        - id: constraint_expression
          expression: sum_connections(capacity_port.value) = quota

    - id: global_constraint_capacity_min
      # Sense >=. Also used for bus nom_min_<carrier>. See global_constraint_capacity_max.
      parameters:
        - id: quota
          time-dependent: false
          scenario-dependent: true
      ports:
        - id: capacity_port
          type: capacity
      binding-constraints:
        - id: constraint_expression
          expression: sum_connections(capacity_port.value) >= quota
