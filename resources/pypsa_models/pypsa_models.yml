# Library of models for the emulation of PyPSA
# References for PyPSA
# T. Brown, J. Hörsch, D. Schlachtberger, PyPSA: Python for Power System Analysis, 2018, Journal of Open Research Software, 6(1), arXiv:1707.09913, DOI:10.5334/jors.188
# https://pypsa.readthedocs.io/en/latest/

library:
  id: pypsa_models
  description: PyPSA model library
  #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#

  port-types:
    - id: flow
      description: A port which transfers power flow
      fields:
        - id: flow
    - id: angle
      description: A port which transfers voltage angle for DC power flow
      fields:
        - id: theta
    - id: emission
      description: A port which accounts for CO2 emissions
      fields:
        - id: emission

  models:
    - id: bus
      #Model for PyPSA bus: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#bus
      parameters:
        - id: v_nom
          time-dependent: false
          scenario-dependent: false
        #- id: type # This parameter is not used in the Gems model
        - id: x
          time-dependent: false
          scenario-dependent: false
        - id: y
          time-dependent: false
          scenario-dependent: false
        #- id : carrier # This parameter is not used in the Gems model
        #- id : unit # This parameter is not used in the Gems model
        #- id : location # This parameter is not used in the Gems model
        - id: v_mag_pu_set
          time-dependent: true
          scenario-dependent: false
        - id: v_mag_pu_min
          time-dependent: false
          scenario-dependent: false
        - id: v_mag_pu_max
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: theta
      ports:
        - id: p_balance_port
          type: flow
        - id: q_balance_port
          type: flow
        - id: theta_port
          type: angle
      port-field-definitions:
        - port: theta_port
          field: theta
          definition: theta
      binding-constraints:
        - id: p_balance
          expression: sum_connections(p_balance_port.flow) = 0
        - id: q_balance
          expression: sum_connections(q_balance_port.flow) = 0

    - id: reference_bus
      # One instance of this model should be connected to exactly one bus
      # to impose theta = 0 on that bus.
      ports:
        - id: theta_port
          type: angle
      binding-constraints:
        - id: theta_reference
          expression: sum_connections(theta_port.theta) = 0

    - id: load
      #Model for PyPSA load: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#load
      parameters:
        #- id : carrier # This parameter is not used in the Gems model
        #- id : type # This parameter is not used in the Gems model
        - id: p_set
          time-dependent: true
          scenario-dependent: true
        - id: q_set
          time-dependent: true
          scenario-dependent: true
        - id: sign #default value = -1
          time-dependent: false
          scenario-dependent: false
        #- id: active #Parameter that is not instantiated: only active components are built by the data converter.
      ports:
        - id: p_balance_port
          type: flow
        - id: q_balance_port
          type: flow
      port-field-definitions:
        - port: p_balance_port
          field: flow
          definition: sign * p_set
        - port: q_balance_port
          field: flow
          definition: sign * q_set

    - id: generator
      #Model for PyPSA generator: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#generator
      parameters:
        #- id: control #Parameter not instantiated for now
        #- id: type # This parameter is not used in the Gems model
        #- id: p_nom_mod #Parameter not instantiated for now
        #- id: p_nom_extendable #Parameter that is not used in Gems model: p_nom_min and p_nom_max are used to possibly fix the value of p_nom
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        #- id: p_set #Parameter not instantiated for now
        #- id: q_set #Parameter not instantiated for now
        - id: e_sum_min
          time-dependent: false
          scenario-dependent: true
        - id: e_sum_max
          time-dependent: false
          scenario-dependent: true
        - id: sign #default value = 1
          time-dependent: false
          scenario-dependent: false
        #- id: carrier # This parameter is not used in the Gems model
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic #Parameter not instantiated for now
        #- id: active #Parameter that is not instantiated: only active components are built by the data converter.
        #- id: build_year #Parameter not instantiated for now
        #- id: lifetime #Parameter not instantiated for now
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        #- id: committable #Parameter not instantiated for now
        #- id: start_up_cost #Parameter not instantiated for now
        #- id: shut_down_cost #Parameter not instantiated for now
        #- id: stand_by_cost #Parameter not instantiated for now
        #- id: min_up_time #Parameter not instantiated for now
        #- id: min_down_time #Parameter not instantiated for now
        #- id: up_time_before #Parameter not instantiated for now
        #- id: down_time_before #Parameter not instantiated for now
        #- id: ramp_limit_up #Parameter not instantiated for now
        #- id: ramp_limit_down #Parameter not instantiated for now
        #- id: ramp_limit_start_up #Parameter not instantiated for now
        #- id: ramp_limit_shut_down #Parameter not instantiated for now
        #- id: weight #Parameter not instantiated for now
        ##Additional parameters that are not stored in the PyPSA object, but in a Carrier object
        - id: emission_factor
          time-dependent: false
          scenario-dependent: false

      variables:
        - id: p_nom
          lower-bound: p_nom_min
          upper-bound: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p
        #- id: q
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        #- id: q_balance_port
        #  type: flow
      port-field-definitions:
        - port: p_balance_port
          field: flow
          definition: p*sign
        - port: emission_port
          field: emission
          definition: p*emission_factor/efficiency
        #- port: q_balance_port
        #  field: flow
        #  definition: q*sign
      constraints:
        - id: min_dispatch
          expression: p >=p_nom * p_min_pu
        - id: max_dispatch
          expression: p <=p_nom * p_max_pu
        - id: min_production
          expression: sum(p) >= e_sum_min
        - id: max_production
          expression: sum(p) <= e_sum_max
      objective-contributions:
        - id: capital_objective
          expression: p_nom * capital_cost
        - id: operational_objective
          expression: sum(marginal_cost * p)

    - id: line
      #Model for PyPSA line in DC economic dispatch (LOPF)
      #Flow is passive and determined by the angle difference and line reactance (KVL: p0 = (θ_bus0 - θ_bus1) / x)
      #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#line
      parameters:
        #- id: type # Cannot be implemented: requires a lookup into the line_types table to derive r/x/b; this is a preprocessing step, not a GEMS model parameter.
        - id: x
          #Series reactance [Ohm]. Required for DC LOPF (linearised power flow). Ignored if type is set.
          time-dependent: false
          scenario-dependent: false
        #- id: r # Cannot be implemented: series resistance is neglected in the DC LOPF approximation (lossless network assumption). Only relevant for AC or lossy DC power flow models.
        #- id: g # Cannot be implemented: shunt conductivity is neglected in the DC LOPF approximation. Only relevant for AC power flow models.
        #- id: b # Cannot be implemented: shunt susceptance is neglected in the DC LOPF approximation. Only relevant for AC power flow models. Ignored if type is set.
        - id: s_nom_min
          #Minimum s_nom [MVA] when s_nom_extendable=True.
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_max
          #Maximum s_nom [MVA] when s_nom_extendable=True.
          time-dependent: false
          scenario-dependent: false
        #- id: s_nom_mod # Cannot be implemented: modular capacity expansion introduces integer variables (MIP), which are not supported in the current GEMS model formulation.
        #- id: s_nom_extendable # Not instantiated: s_nom_min and s_nom_max are used to fix s_nom for non-extendable lines (set to s_nom value by the converter).
        #- id: s_nom_set # Not instantiated: fixing s_nom_opt is handled by setting s_nom_min = s_nom_max in the converter.
        - id: s_max_pu
          #Maximum allowed flow per unit of s_nom. Can be < 1 for N-1 contingency or time-varying for dynamic line rating.
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          #Annuitised investment cost per MVA of s_nom extension [currency/MVA].
          time-dependent: false
          scenario-dependent: false
        #- id: overnight_cost # Not instantiated: upfront investment cost must be converted to an annuitised capital_cost by the converter before being passed to the GEMS model.
        #- id: discount_rate # Not instantiated: used only by the converter to compute capital_cost from overnight_cost; not a GEMS model parameter.
        #- id: fom_cost # Not instantiated for now.
        #- id: active # Not instantiated: only active components are built by the data converter.
        #- id: build_year # Not instantiated for now.
        #- id: lifetime # Not instantiated: used only by the converter to compute capital_cost from overnight_cost; not a GEMS model parameter.
        #- id: length # Cannot be implemented: physical line length is not a variable or constraint in the GEMS model; used only in preprocessing to scale type-based impedances.
        #- id: carrier # Cannot be implemented: carrier (AC/DC) is a classification attribute with no role in the GEMS model equations.
        #- id: terrain_factor # Cannot be implemented: scaling factor applied to length in preprocessing to adjust capital_cost; not a GEMS model parameter.
        #- id: num_parallel # Cannot be implemented: number of parallel circuits is resolved in preprocessing when type is set; not a GEMS model parameter.
        #- id: v_ang_min # Not instantiated: voltage angle difference bounds are placeholder attributes in PyPSA and not currently used in optimisation.
        #- id: v_ang_max # Not instantiated: voltage angle difference bounds are placeholder attributes in PyPSA and not currently used in optimisation.
      variables:
        - id: s_nom
          lower-bound: s_nom_min
          upper-bound: s_nom_max
        - id: p0
      ports:
        - id: bus0_p_port
          type: flow
        - id: bus1_p_port
          type: flow
        - id: bus0_theta_port
          type: angle
        - id: bus1_theta_port
          type: angle
      port-field-definitions:
        - port: bus0_p_port
          field: flow
          definition: -p0
        - port: bus1_p_port
          field: flow
          definition: p0
      constraints:
        - id: dc_flow
          expression: p0 = (sum_connections(bus0_theta_port.theta) - sum_connections(bus1_theta_port.theta)) / x
        - id: upper_flow
          expression: p0 <= s_nom * s_max_pu
        - id: lower_flow
          expression: p0 >= -s_nom * s_max_pu
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * s_nom

    - id: transformer
      #Model for PyPSA transformer in DC economic dispatch (LOPF)
      #In DC LOPF a transformer is treated as a line with effective per-unit reactance.
      #The tap ratio effect is absorbed into x_pu_eff by the converter (PyPSA output column).
      #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#transformer
      parameters:
        #- id: type # Cannot be implemented: standard type lookup (overrides r/x/b/s_nom/tap_ratio) is a preprocessing step, not a GEMS model parameter.
        #- id: model # Cannot be implemented: admittance model (t or pi) only affects AC power flow equations; not used in DC LOPF.
        - id: x_pu_eff
          #Effective per-unit series reactance for DC LOPF, pre-computed by the converter from x and tap_ratio.
          time-dependent: false
          scenario-dependent: false
        #- id: r # Cannot be implemented: series resistance neglected in DC LOPF approximation.
        #- id: g # Cannot be implemented: shunt conductivity neglected in DC LOPF approximation.
        #- id: b # Cannot be implemented: shunt susceptance neglected in DC LOPF approximation.
        #- id: tap_ratio # Cannot be implemented directly: effect on reactance is absorbed into x_pu_eff by the converter; effect on voltage magnitude is neglected in DC LOPF.
        #- id: tap_side # Not a GEMS model parameter: only used with tap_ratio in preprocessing to compute x_pu_eff.
        #- id: tap_position # Not a GEMS model parameter: only used with type in preprocessing.
        #- id: phase_shift # Not instantiated for now: could be implemented as an angle offset in the dc_flow constraint: p0 = (θ_bus0 - θ_bus1 - phase_shift) / x_pu_eff.
        - id: s_nom_min
          #Minimum s_nom [MVA] when s_nom_extendable=True.
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_max
          #Maximum s_nom [MVA] when s_nom_extendable=True.
          time-dependent: false
          scenario-dependent: false
        #- id: s_nom_mod # Cannot be implemented: modular capacity expansion introduces integer variables (MIP), not supported in the current GEMS model formulation.
        #- id: s_nom_extendable # Not instantiated: s_nom_min and s_nom_max are used to fix s_nom for non-extendable transformers (set to s_nom value by the converter).
        #- id: s_nom_set # Not instantiated: fixing s_nom_opt is handled by setting s_nom_min = s_nom_max in the converter.
        - id: s_max_pu
          #Maximum allowed flow per unit of s_nom.
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          #Annuitised investment cost per MVA of s_nom extension [currency/MVA].
          time-dependent: false
          scenario-dependent: false
        #- id: overnight_cost # Not instantiated: upfront investment cost must be converted to an annuitised capital_cost by the converter before being passed to the GEMS model.
        #- id: discount_rate # Not instantiated: used only by the converter to compute capital_cost from overnight_cost; not a GEMS model parameter.
        #- id: fom_cost # Not instantiated for now.
        #- id: num_parallel # Cannot be implemented: number of parallel transformers is resolved in preprocessing when type is set; not a GEMS model parameter.
        #- id: active # Not instantiated: only active components are built by the data converter.
        #- id: build_year # Not instantiated for now.
        #- id: lifetime # Not instantiated: used only by the converter to compute capital_cost from overnight_cost; not a GEMS model parameter.
        #- id: v_ang_min # Not instantiated: placeholder attribute in PyPSA, not currently used in optimisation.
        #- id: v_ang_max # Not instantiated: placeholder attribute in PyPSA, not currently used in optimisation.
      variables:
        - id: s_nom
          lower-bound: s_nom_min
          upper-bound: s_nom_max
        - id: p0
      ports:
        - id: bus0_p_port
          type: flow
        - id: bus1_p_port
          type: flow
        - id: bus0_theta_port
          type: angle
        - id: bus1_theta_port
          type: angle
      port-field-definitions:
        - port: bus0_p_port
          field: flow
          definition: -p0
        - port: bus1_p_port
          field: flow
          definition: p0
      constraints:
        - id: dc_flow
          expression: p0 = (sum_connections(bus0_theta_port.theta) - sum_connections(bus1_theta_port.theta)) / x_pu_eff
        - id: upper_flow
          expression: p0 <= s_nom * s_max_pu
        - id: lower_flow
          expression: p0 >= -s_nom * s_max_pu
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * s_nom

    - id: link
      #Model for PyPSA link: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#link
      parameters:
        #- id: type # This parameter is not used in the Gems model
        #- id: carrier # This parameter is not used in the Gems model
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        #- id: active #Parameter that is not instantiated: only active components are built by the data converter.
        #- id: build_year #Parameter not instantiated for now
        #- id: lifetime #Parameter not instantiated for now
        #- id: p_nom_mod #Parameter not instantiated for now
        #- id: p_nom_extendable #Parameter that is not instantiated: p_nom_min and p_nom_max are used to possibly fix the value of p_nom
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        #- id: p_set #Parameter not instantiated for now
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic #Parameter not instantiated for now
        #- id: stand_by_cost #Parameter not instantiated for now
        #- id: length #Parameter not instantiated for now
        #- id: terrain_factor #Parameter not instantiated for now
        #- id: committable #Parameter not instantiated for now
        #- id: start_up_cost #Parameter not instantiated for now
        #- id: shut_down_cost #Parameter not instantiated for now
        #- id: min_up_time #Parameter not instantiated for now
        #- id: min_down_time #Parameter not instantiated for now
        #- id: up_time_before #Parameter not instantiated for now
        #- id: down_time_before #Parameter not instantiated for now
        #- id: ramp_limit_up #Parameter not instantiated for now
        #- id: ramp_limit_down #Parameter not instantiated for now
        #- id: ramp_limit_start_up #Parameter not instantiated for now
        #- id: ramp_limit_shut_down #Parameter not instantiated for now
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p0
        #- id: p_nom_opt
        #- id: status
        #- id: start_up
        #- id: shut_down
      ports:
        - id: p0_port
          type: flow
        #- id: q_0_port
        #  type: flow
        - id: p1_port
          type: flow
        #- id: q_1_port
        #  type: flow
      port-field-definitions:
        - port: p0_port
          field: flow
          definition: -p0
        - port: p1_port
          field: flow
          definition: efficiency * p0
        #- port: q_balance_port
        #  field: flow
        #  definition: q
      constraints:
        - id: p0_upper
          expression: p0 <= p_max_pu * p_nom
        - id: p0_lower
          expression: p0 >= p_min_pu * p_nom
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(marginal_cost * p0)

    - id: storage_unit
      #Model for PyPSA storage unit: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#storage-unit
      parameters:
        #- id: control #Parameter not instantiated for now
        #- id: type # This parameter is not used in the Gems model
        #- id: p_nom_mod #Parameter not instantiated for now
        #- id: p_nom_extendable #Parameter that is not instantiated: p_nom_min and p_nom_max are used to possibly fix the value of p_nom
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        #- id: p_set #Parameter not instantiated for now
        #- id: q_set #Parameter not instantiated for now
        - id: sign #default value = 1
          time-dependent: false
          scenario-dependent: false
        #- id: carrier # This parameter is not used in the Gems model
        - id: spill_cost #Parameter not instantiated for now
          time-dependent: true
          scenario-dependent: true
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic #Parameter not instantiated for now
        - id: marginal_cost_storage
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        #- id: active #Parameter that is not instantiated: only active components are built by the data converter.
        #- id: build_year #Parameter not instantiated for now
        #- id: lifetime #Parameter not instantiated for now
        #- id: state_of_charge_initial #Parameter not instantiated for now
        #- id: state_of_charge_initial_per_period #Parameter not instantiated for now
        #- id: state_pf_charge_set #Parameter not instantiated for now
        #- id: cyclic_state_of_charge #Parameter not instantiated for now
        #- id: cyclic_state_of_charge_per_period #Parameter not instantiated for now
        - id: max_hours
          time-dependent: false
          scenario-dependent: false
        - id: efficiency_store
          time-dependent: true
          scenario-dependent: true
        - id: efficiency_dispatch
          time-dependent: true
          scenario-dependent: true
        - id: standing_loss
          time-dependent: true
          scenario-dependent: true
        - id: inflow
          time-dependent: true
          scenario-dependent: true
        ##Additional parameters that are not stored in the PyPSA object, but in a Carrier object
        - id: emission_factor
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p_store
          lower-bound: 0
          upper-bound: p_max_pu * p_nom_max
        - id: p_dispatch
          lower-bound: 0
          upper-bound: p_max_pu * p_nom_max
        - id: state_of_charge
          lower-bound: 0
          upper-bound: max_hours * p_nom_max
        - id: spill
          lower-bound: 0
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
      port-field-definitions:
        - port: p_balance_port
          field: flow
          definition: p_dispatch - p_store
        - port: emission_port
          field: emission
          definition: emission_factor * 0 #Since we assume here cyclity of StorageUnits. In the future, for non-cyclic Store: (e[-1] - e[T-1])*emission_factor
      constraints:
        - id: p_store_upper
          expression: p_store <= p_max_pu * p_nom
        - id: p_dispatch_upper
          expression: p_dispatch <= p_max_pu * p_nom
        - id: state_of_charge_upper
          expression: state_of_charge <= max_hours * p_nom
        - id: state_of_charge_balance
          expression: state_of_charge = (1- standing_loss) * state_of_charge[t-1] + efficiency_store * p_store - p_dispatch / efficiency_dispatch  + inflow - spill
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(marginal_cost * p_dispatch + spill_cost*spill + marginal_cost_storage * state_of_charge)

    - id: store
      #Model for PyPSA store: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#store
      parameters:
        #- id: type # This parameter is not used in the Gems model
        #- id: carrier # This parameter is not used in the Gems model
        #- id: e_nom_mod #Parameter not instantiated for now
        #- id: e_nom_extendable #Parameter that is not instantiated: e_nom_min and e_nom_max are used to possibly fix the value of e_nom
        - id: e_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: e_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: e_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: e_max_pu
          time-dependent: true
          scenario-dependent: true
        #- id: e_initial #Parameter not instantiated for now
        #- id: e_initial_per_period #Parameter not instantiated for now
        #- id: e_cyclic #Parameter not instantiated for now
        #- id: e_cyclic_per_period #Parameter not instantiated for now
        #- id: p_set #Parameter not instantiated for now
        #- id: q_set #Parameter not instantiated for now
        - id: sign #default value = 1
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic #Parameter not instantiated for now
        - id: marginal_cost_storage
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: standing_loss
          time-dependent: true
          scenario-dependent: true
        #- id: active #Parameter that is not instantiated: only active components are built by the data converter.
        #- id: build_year #Parameter not instantiated for now
        #- id: lifetime #Parameter not instantiated for now
        ##Additional parameters that are not stored in the PyPSA object, but in a Carrier object
        - id: emission_factor
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: e_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: e_nom_min
          upper-bound: e_nom_max
        - id: e
        - id: p
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
      port-field-definitions:
        - port: p_balance_port
          field: flow
          definition: p
        - port: emission_port
          field: emission
          definition: emission_factor * 0 #Since we assume here cyclity of stores. In the future, for non-cyclic Store: (e[-1] - e[T-1])*emission_factor
      constraints:
        - id: e_upper
          expression: e <= e_max_pu * e_nom
        - id: e_lower
          expression: e >= e_min_pu * e_nom
        - id: energy_balance
          expression: e = (1 - standing_loss) * e[t-1] - p
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * e_nom
        - id: operational_objective
          expression: sum(marginal_cost * p + marginal_cost_storage * e)

    #### Models for PyPSA global constraint: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#global-constraint ###

    - id: global_constraint_co2_max
      #Model for PyPSA global constraint: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#global-constraint
      # Case CO2, <=
      parameters:
        #-type = Primary energy
        #-carrier_attribute = CO2_emissions
        #sense = <=
        - id: quota
          time-dependent: false
          scenario-dependent: false
      ports:
        - id: emission_port
          type: emission
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(emission_port.emission)) <= quota

    - id: global_constraint_co2_eq
      #Model for PyPSA global constraint: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#global-constraint
      # Case CO2, ==
      parameters:
        #-type = Primary energy
        #-carrier_attribute = CO2_emissions
        #sense = ==
        - id: quota
          time-dependent: false
          scenario-dependent: false
      ports:
        - id: emission_port
          type: emission
      binding-constraints:
        - id: constraint_expression
          expression: sum(sum_connections(emission_port.emission)) = quota
