# Library of models for the emulation of PyPSA
# References for PyPSA
# T. Brown, J. Hörsch, D. Schlachtberger, PyPSA: Python for Power System Analysis, 2018, Journal of Open Research Software, 6(1), arXiv:1707.09913, DOI:10.5334/jors.188
# https://pypsa.readthedocs.io/en/latest/
#
# Model variants. GEMS has no model inheritance yet, so a PyPSA component type whose options change the
# equations is mapped onto several close models, and the converter picks one per component:
#   - generator / generator_ramp: without / with ramp limits (ramp_limit_up, ramp_limit_down)
#   - link / link_ramp: 2-port link without / with ramp limits
#   - link_multiport / link_multiport_ramp: Link with bus2..bus4, and Process, without / with ramp limits
#   - storage_unit / storage_unit_non_cyclic: cyclic_state_of_charge True / False
#   - store / store_non_cyclic: e_cyclic True / False
# The *_ramp and *_non_cyclic models have constraints referring to the previous time step that PyPSA does not
# wrap around the horizon: the converter declares them with `out-of-bounds-processing: drop` in optim-config.yml.
#
# Time granularity: hours_per_time_step comes from n.snapshot_weightings.generators (generator models) or
# n.snapshot_weightings.stores (storage models); objective_weighting from n.snapshot_weightings.objective.
# Both may vary over time. standing_efficiency = (1 - standing_loss)^hours_per_time_step is computed by the
# converter, because Antares Modeler only accepts constant exponents.

library:
  id: pypsa_models
  version: "3.0.0"
  description: PyPSA model library
  #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#

  port-types:
    - id: flow
      description: A port which transfers power flow
      fields:
        - id: power
        - id: angle
    - id: emission
      description: A port which accounts for CO2 emissions (more generally, the carrier attribute of a primary_energy global constraint)
      fields:
        - id: emission
    - id: quantity
      description: A time-dependent quantity summed over the horizon by a global constraint (energy produced, storage depletion, final storage level)
      fields:
        - id: value
    - id: capacity
      description: A time-independent quantity summed by a global constraint (installed capacity, possibly weighted by length or cost)
      fields:
        - id: value

  models:
    - id: bus
      #Model for PyPSA bus: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#bus
      parameters:
        - id: v_nom
          time-dependent: false
          scenario-dependent: false
        #- id: type # This parameter is not used in the Gems model
        - id: x
          time-dependent: false
          scenario-dependent: false
        - id: y
          time-dependent: false
          scenario-dependent: false
        #- id: carrier # This parameter is not used in the Gems model
        #- id: unit # This parameter is not used in the Gems model
        #- id: location # This parameter is not used in the Gems model
        - id: v_mag_pu_set
          time-dependent: true
          scenario-dependent: false
        - id: v_mag_pu_min
          time-dependent: false
          scenario-dependent: false
        - id: v_mag_pu_max
          time-dependent: false
          scenario-dependent: false
        - id: theta_min
          time-dependent: false
          scenario-dependent: false
        - id: theta_max
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: theta
          lower-bound: theta_min
          upper-bound: theta_max
      ports:
        - id: p_balance_port
          type: flow
        - id: q_balance_port
          type: flow
      port-field-definitions:
        - port: p_balance_port
          field: angle
          definition: theta
      binding-constraints:
        - id: p_balance
          expression: sum_connections(p_balance_port.power) = 0
        - id: q_balance
          expression: sum_connections(q_balance_port.power) = 0

    - id: load
      #Model for PyPSA load: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#load
      parameters:
        #- id: carrier # This parameter is not used in the Gems model
        #- id: type # This parameter is not used in the Gems model
        - id: p_set
          time-dependent: true
          scenario-dependent: true
        - id: q_set
          time-dependent: true
          scenario-dependent: true
        - id: sign # default value = -1
          time-dependent: false
          scenario-dependent: false
        #- id: active # Not instantiated: the converter drops inactive components.
      ports:
        - id: p_balance_port
          type: flow
        - id: q_balance_port
          type: flow
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: sign * p_set
        - port: q_balance_port
          field: power
          definition: sign * q_set

    - id: generator
      #Model for PyPSA generator: https://pypsa.readthedocs.io/en/latest/user-guide/components.html#generator
      parameters:
        #- id: control # Not used in DC LOPF
        #- id: type # This parameter is not used in the Gems model
        #- id: p_nom_mod # Not instantiated: modular expansion is rejected by the converter
        #- id: p_nom_extendable # Not used in the Gems model: p_nom_min and p_nom_max fix p_nom for non-extendable generators
        #- id: p_nom_set # Handled by converter: p_nom_min = p_nom_max = p_nom_set for extendable generators
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        #- id: p_set # Not instantiated: fixed dispatch is rejected by the converter
        #- id: q_set # No reactive power in DC LOPF
        - id: e_sum_min
          time-dependent: false
          scenario-dependent: true
        - id: e_sum_max
          time-dependent: false
          scenario-dependent: true
        - id: sign # default value = 1
          time-dependent: false
          scenario-dependent: false
        #- id: carrier # Used by the converter to connect the generator to global constraints
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic # Non-linear: rejected by the converter
        #- id: active # Not instantiated: the converter drops inactive components.
        #- id: build_year # Only used with investment periods, which are rejected
        #- id: lifetime # Only used with investment periods and overnight_cost
        - id: capital_cost
          # Periodized cost: capital_cost + fom_cost, or annuity(overnight_cost, discount_rate, lifetime) + fom_cost
          time-dependent: false
          scenario-dependent: false
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        #- id: committable # Unit commitment (MILP): rejected by the converter
        #- id: start_up_cost, shut_down_cost, stand_by_cost, min_up_time, min_down_time, up_time_before,
        #      down_time_before, ramp_limit_start_up, ramp_limit_shut_down # Unit commitment only
        #- id: ramp_limit_up, ramp_limit_down # See generator_ramp
        #- id: weight # Used only for network clustering
        - id: emission_factor
          # Carrier attribute (co2_emissions by default) of the generator's carrier, used by primary_energy global constraints
          time-dependent: false
          scenario-dependent: true
        - id: hours_per_time_step
          # Source: PyPSA n.snapshot_weightings.generators
          time-dependent: true
          scenario-dependent: false
        - id: objective_weighting
          # Source: PyPSA n.snapshot_weightings.objective
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: p_nom
          lower-bound: p_nom_min
          upper-bound: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        - id: operational_port
          type: quantity
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: p*sign
        - port: emission_port
          field: emission
          definition: p*emission_factor*hours_per_time_step/efficiency
        - port: operational_port
          field: value
          definition: p * hours_per_time_step
        - port: capacity_port
          field: value
          definition: p_nom
      constraints:
        - id: min_dispatch
          expression: p >=p_nom * p_min_pu
        - id: max_dispatch
          expression: p <=p_nom * p_max_pu
        - id: min_production
          expression: sum(p * hours_per_time_step) >= e_sum_min
        - id: max_production
          expression: sum(p * hours_per_time_step) <= e_sum_max
      objective-contributions:
        - id: capital_objective
          expression: p_nom * capital_cost
        - id: operational_objective
          expression: sum(objective_weighting * marginal_cost * p)

    - id: generator_ramp
      #Model for PyPSA generator with ramp limits (ramp_limit_up and/or ramp_limit_down set).
      #Same as generator, plus the ramp constraints of PyPSA's define_ramp_limit_constraints (non-committable case):
      #  p[t] - p[t-1] <= ramp_limit_up * p_nom and p[t] - p[t-1] >= -ramp_limit_down * p_nom, for t >= 1.
      #ramp_up and ramp_down are declared with `out-of-bounds-processing: drop` (no wrap-around at t = 0).
      #At t = 0, PyPSA ramps from p_init when it is set: ramp_*_initial, switched off by p_init_active = 0.
      parameters:
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: e_sum_min
          time-dependent: false
          scenario-dependent: true
        - id: e_sum_max
          time-dependent: false
          scenario-dependent: true
        - id: sign
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        - id: emission_factor
          time-dependent: false
          scenario-dependent: true
        - id: hours_per_time_step
          time-dependent: true
          scenario-dependent: false
        - id: objective_weighting
          time-dependent: true
          scenario-dependent: false
        - id: ramp_limit_up
          # Per unit of p_nom. Set to 1 by the converter where ramp_up_active = 0.
          time-dependent: true
          scenario-dependent: true
        - id: ramp_limit_down
          # Per unit of p_nom. Set to 1 by the converter where ramp_down_active = 0.
          time-dependent: true
          scenario-dependent: true
        - id: ramp_up_active
          # 1 where PyPSA's ramp_limit_up is set (not NaN), else 0
          time-dependent: true
          scenario-dependent: true
        - id: ramp_down_active
          # 1 where PyPSA's ramp_limit_down is set (not NaN), else 0
          time-dependent: true
          scenario-dependent: true
        - id: p_init
          # Dispatch before the first time step (PyPSA p_init). 0 where p_init_active = 0.
          time-dependent: false
          scenario-dependent: true
        - id: p_init_active
          # 1 if PyPSA's p_init is set (not NaN), else 0
          time-dependent: false
          scenario-dependent: true
      variables:
        - id: p_nom
          lower-bound: p_nom_min
          upper-bound: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p
      ports:
        - id: p_balance_port
          type: flow
        - id: emission_port
          type: emission
        - id: operational_port
          type: quantity
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: p_balance_port
          field: power
          definition: p*sign
        - port: emission_port
          field: emission
          definition: p*emission_factor*hours_per_time_step/efficiency
        - port: operational_port
          field: value
          definition: p * hours_per_time_step
        - port: capacity_port
          field: value
          definition: p_nom
      constraints:
        - id: min_dispatch
          expression: p >=p_nom * p_min_pu
        - id: max_dispatch
          expression: p <=p_nom * p_max_pu
        - id: min_production
          expression: sum(p * hours_per_time_step) >= e_sum_min
        - id: max_production
          expression: sum(p * hours_per_time_step) <= e_sum_max
        - id: ramp_up
          expression: ramp_up_active * (p - p[t-1]) <= ramp_limit_up * p_nom
        - id: ramp_down
          expression: ramp_down_active * (p - p[t-1]) >= -ramp_limit_down * p_nom
        - id: ramp_up_initial
          expression: p_init_active * ramp_up_active[0] * (p[0] - p_init) <= ramp_limit_up[0] * p_nom
        - id: ramp_down_initial
          expression: p_init_active * ramp_down_active[0] * (p[0] - p_init) >= -ramp_limit_down[0] * p_nom
      objective-contributions:
        - id: capital_objective
          expression: p_nom * capital_cost
        - id: operational_objective
          expression: sum(objective_weighting * marginal_cost * p)

    - id: line
      #Model for PyPSA line in DC LOPF: fixed capacity or continuous extendable (LP).
      #s_nom_opt is a continuous variable bounded [s_nom_min, s_nom_max]; s_nom_min = s_nom_max for fixed capacity.
      #Lines with modular expansion (s_nom_extendable and s_nom_mod > 0) use line_modular. Keeping the integer
      #module count out of this model keeps studies without modular lines linear: solvers such as HiGHS switch to
      #their MIP algorithm (and ignore an IPM setting) as soon as one integer variable is declared, even fixed to 0.
      #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#line
      parameters:
        - id: x
          # Effective per-unit series reactance for DC LOPF, will be extracted from PyPSA objects after calling calculate_dependent_values() PyPSA function. It is important to call this function after loading entire PyPSA study into PyPSA Network object!
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_min
          #Minimum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_max
          #Maximum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_max_pu
          #Maximum allowed flow per unit of installed capacity. Can be < 1 for N-1 contingency or time-varying for dynamic line rating.
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          #Periodized investment cost per MVA of installed capacity [currency/MVA]: capital_cost + fom_cost, or
          #annuity(overnight_cost, discount_rate, lifetime) + fom_cost (PyPSA >= 1.1.0 periodized_cost).
          time-dependent: false
          scenario-dependent: false
        - id: length
          #Line length [km]. Only used by transmission_volume_expansion_limit global constraints.
          time-dependent: false
          scenario-dependent: false
        #- id: type # Preprocessing: triggers lookup in line_types table — overrides r, x, b. Converter must call calculate_dependent_values() first.
        #- id: r # Not used in DC LOPF.
        #- id: g # Not used in DC LOPF.
        #- id: b # Not used in DC LOPF.
        #- id: s_nom # Handled by converter: translated into s_nom_min/s_nom_max.
        #- id: s_nom_extendable # Handled by converter: False → s_nom_min = s_nom_max = s_nom; True → use s_nom_min/s_nom_max directly.
        #- id: s_nom_mod # Handled by converter: extendable lines with s_nom_mod > 0 use line_modular.
        #- id: s_nom_set # Handled by converter: for extendable lines, s_nom_min = s_nom_max = s_nom_set (pins optimal capacity).
        #- id: overnight_cost # Handled by converter: folded into capital_cost (periodized cost).
        #- id: discount_rate # Handled by converter: folded into capital_cost (periodized cost).
        #- id: fom_cost # Handled by converter: folded into capital_cost (periodized cost).
        #- id: active # Handled by converter: inactive lines are dropped.
        #- id: build_year # Used in investment periods only, which are rejected.
        #- id: lifetime # Used with overnight_cost (folded into capital_cost) and in investment periods.
        #- id: carrier # Used by the converter to connect the line to global constraints.
        #- id: terrain_factor # Defined in PyPSA schema but never read by the optimizer. User must pre-multiply into capital_cost.
        #- id: num_parallel # Only used when type is set (scales r/x/b from line_types); ignored otherwise.
        #- id: v_ang_min # Deprecated and ignored by PyPSA >= 1.4.0.
        #- id: v_ang_max # Enforced by PyPSA >= 1.4.0: rejected by the converter.
      variables:
        - id: s_nom_opt
          #Installed capacity [MVA].
          lower-bound: s_nom_min
          upper-bound: s_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p0
      ports:
        - id: bus0_p_port
          type: flow
        - id: bus1_p_port
          type: flow
        - id: capacity_port
          type: capacity
        - id: expansion_volume_port
          type: capacity
        - id: expansion_cost_port
          type: capacity
      port-field-definitions:
        - port: bus0_p_port
          field: power
          definition: -p0
        - port: bus1_p_port
          field: power
          definition: p0
        - port: capacity_port
          field: value
          definition: s_nom_opt
        - port: expansion_volume_port
          field: value
          definition: length * s_nom_opt
        - port: expansion_cost_port
          field: value
          definition: capital_cost * s_nom_opt
      constraints:
        - id: upper_flow
          expression: p0 <= s_nom_opt * s_max_pu
        - id: lower_flow
          expression: p0 >= -s_nom_opt * s_max_pu
      binding-constraints:
        - id: dc_flow
          expression: p0 = (sum_connections(bus0_p_port.angle) - sum_connections(bus1_p_port.angle)) / x
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * s_nom_opt

    - id: line_modular
      #Variant of line with modular expansion (MIP): capacity = n_mod * s_nom_mod with n_mod an integer number of
      #modules, and s_nom_min <= capacity <= s_nom_max. Used for extendable lines with s_nom_mod > 0.
      #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#line
      parameters:
        - id: x
          #Effective per-unit series reactance for DC LOPF (see line).
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_min
          #Minimum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_max
          #Maximum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_mod
          #Module size [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_max_pu
          #Maximum allowed flow per unit of installed capacity.
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          #Periodized investment cost per MVA of installed capacity [currency/MVA] (see line).
          time-dependent: false
          scenario-dependent: false
        - id: length
          #Line length [km]. Only used by transmission_volume_expansion_limit global constraints.
          time-dependent: false
          scenario-dependent: false
        #Attributes not listed here are handled as in line.
      variables:
        - id: n_mod
          #Number of installed modules.
          lower-bound: 0
          upper-bound: s_nom_max
          variable-type: integer
          time-dependent: false
          scenario-dependent: false
        - id: p0
      ports:
        - id: bus0_p_port
          type: flow
        - id: bus1_p_port
          type: flow
        - id: capacity_port
          type: capacity
        - id: expansion_volume_port
          type: capacity
        - id: expansion_cost_port
          type: capacity
      port-field-definitions:
        - port: bus0_p_port
          field: power
          definition: -p0
        - port: bus1_p_port
          field: power
          definition: p0
        - port: capacity_port
          field: value
          definition: n_mod * s_nom_mod
        - port: expansion_volume_port
          field: value
          definition: length * n_mod * s_nom_mod
        - port: expansion_cost_port
          field: value
          definition: capital_cost * n_mod * s_nom_mod
      constraints:
        - id: capacity_min
          expression: n_mod * s_nom_mod >= s_nom_min
        - id: capacity_max
          expression: n_mod * s_nom_mod <= s_nom_max
        - id: upper_flow
          expression: p0 <= n_mod * s_nom_mod * s_max_pu
        - id: lower_flow
          expression: p0 >= -n_mod * s_nom_mod * s_max_pu
      binding-constraints:
        - id: dc_flow
          expression: p0 = (sum_connections(bus0_p_port.angle) - sum_connections(bus1_p_port.angle)) / x
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * n_mod * s_nom_mod

    - id: transformer
      #Model for PyPSA transformer in DC LOPF: fixed capacity or continuous extendable (LP).
      #s_nom_opt is a continuous variable bounded [s_nom_min, s_nom_max]; s_nom_min = s_nom_max for fixed capacity.
      #Transformers with modular expansion (s_nom_extendable and s_nom_mod > 0) use transformer_modular (see line).
      #x_pu_eff is the effective per-unit reactance pre-computed from x and tap_ratio by the converter.
      #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#transformer
      parameters:
        - id: x_pu_eff
          # Effective per-unit series reactance for DC LOPF, will be extracted from PyPSA objects after calling calculate_dependent_values() PyPSA function. It is important to call this function after loading entire PyPSA study into PyPSA Network object!
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_min
          #Minimum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_max
          #Maximum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_max_pu
          #Maximum allowed flow per unit of installed capacity.
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          #Periodized investment cost per MVA of installed capacity [currency/MVA]: capital_cost + fom_cost, or
          #annuity(overnight_cost, discount_rate, lifetime) + fom_cost (PyPSA >= 1.1.0 periodized_cost).
          time-dependent: false
          scenario-dependent: false
        #- id: s_nom_mod # Handled by converter: extendable transformers with s_nom_mod > 0 use transformer_modular.
        #- id: type # Preprocessing: triggers lookup in transformer_types table — overrides r, x, g, b, s_nom, tap_ratio, tap_side, phase_shift. Converter must call calculate_dependent_values() first.
        #- id: model # Cannot be implemented: admittance model (t or pi) only affects AC power flow equations; not used in DC LOPF.
        #- id: r # Not used in DC LOPF.
        #- id: g # Not used in DC LOPF.
        #- id: b # Not used in DC LOPF.
        #- id: tap_ratio # Absorbed into x_pu_eff by calculate_dependent_values() — x_pu_eff = (x/s_nom)*tap_ratio. Overridden by transformer_types table when type is set.
        #- id: tap_side # Not used in DC LOPF (AC power flow only). Overridden by transformer_types table when type is set.
        #- id: tap_position # Only used when type is set — To be investigated how it is used within type.
        #- id: phase_shift # Changes the KVL flows: rejected by the converter when non-zero.
        #- id: s_nom # Handled by converter: translated into s_nom_min/s_nom_max bounds on s_nom_opt.
        #- id: s_nom_extendable # Handled by converter: False → s_nom_min = s_nom_max = s_nom; True → use s_nom_min/s_nom_max directly.
        #- id: s_nom_set # Handled by converter: for extendable transformers, s_nom_min = s_nom_max = s_nom_set (pins optimal capacity).
        #- id: overnight_cost # Handled by converter: folded into capital_cost (periodized cost).
        #- id: discount_rate # Handled by converter: folded into capital_cost (periodized cost).
        #- id: fom_cost # Handled by converter: folded into capital_cost (periodized cost).
        #- id: num_parallel # Only used when type is set (scales all impedances from transformer_types); ignored otherwise.
        #- id: active # Handled by converter: inactive transformers are dropped.
        #- id: build_year # Used in investment periods only, which are rejected.
        #- id: lifetime # Used with overnight_cost (folded into capital_cost) and in investment periods.
        #- id: v_ang_min # Deprecated and ignored by PyPSA >= 1.4.0.
        #- id: v_ang_max # Enforced by PyPSA >= 1.4.0: rejected by the converter.
      variables:
        - id: s_nom_opt
          #Installed capacity [MVA].
          lower-bound: s_nom_min
          upper-bound: s_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p0
      ports:
        - id: bus0_p_port
          type: flow
        - id: bus1_p_port
          type: flow
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: bus0_p_port
          field: power
          definition: -p0
        - port: bus1_p_port
          field: power
          definition: p0
        - port: capacity_port
          field: value
          definition: s_nom_opt
      constraints:
        - id: upper_flow
          expression: p0 <= s_nom_opt * s_max_pu
        - id: lower_flow
          expression: p0 >= -s_nom_opt * s_max_pu
      binding-constraints:
        - id: dc_flow
          expression: p0 = (sum_connections(bus0_p_port.angle) - sum_connections(bus1_p_port.angle)) / x_pu_eff
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * s_nom_opt

    - id: transformer_modular
      #Variant of transformer with modular expansion (MIP): capacity = n_mod * s_nom_mod with n_mod an integer number
      #of modules, and s_nom_min <= capacity <= s_nom_max. Used for extendable transformers with s_nom_mod > 0.
      #https://pypsa.readthedocs.io/en/latest/user-guide/components.html#transformer
      parameters:
        - id: x_pu_eff
          #Effective per-unit series reactance for DC LOPF (see transformer).
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_min
          #Minimum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_max
          #Maximum installed capacity [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_nom_mod
          #Module size [MVA].
          time-dependent: false
          scenario-dependent: false
        - id: s_max_pu
          #Maximum allowed flow per unit of installed capacity.
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          #Periodized investment cost per MVA of installed capacity [currency/MVA] (see transformer).
          time-dependent: false
          scenario-dependent: false
        #Attributes not listed here are handled as in transformer.
      variables:
        - id: n_mod
          #Number of installed modules.
          lower-bound: 0
          upper-bound: s_nom_max
          variable-type: integer
          time-dependent: false
          scenario-dependent: false
        - id: p0
      ports:
        - id: bus0_p_port
          type: flow
        - id: bus1_p_port
          type: flow
        - id: capacity_port
          type: capacity
      port-field-definitions:
        - port: bus0_p_port
          field: power
          definition: -p0
        - port: bus1_p_port
          field: power
          definition: p0
        - port: capacity_port
          field: value
          definition: n_mod * s_nom_mod
      constraints:
        - id: capacity_min
          expression: n_mod * s_nom_mod >= s_nom_min
        - id: capacity_max
          expression: n_mod * s_nom_mod <= s_nom_max
        - id: upper_flow
          expression: p0 <= n_mod * s_nom_mod * s_max_pu
        - id: lower_flow
          expression: p0 >= -n_mod * s_nom_mod * s_max_pu
      binding-constraints:
        - id: dc_flow
          expression: p0 = (sum_connections(bus0_p_port.angle) - sum_connections(bus1_p_port.angle)) / x_pu_eff
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * n_mod * s_nom_mod

    - id: link
      #Model for PyPSA link with two buses (bus0 -> bus1): https://pypsa.readthedocs.io/en/latest/user-guide/components.html#link
      #Links with bus2, bus3 or bus4 use link_multiport.
      parameters:
        #- id: type # This parameter is not used in the Gems model
        #- id: carrier # Used by the converter to connect the link to global constraints
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        #- id: active # Not instantiated: the converter drops inactive components.
        #- id: build_year # Only used with investment periods, which are rejected
        #- id: lifetime # Only used with investment periods and overnight_cost
        #- id: p_nom_mod # Not instantiated: modular expansion is rejected by the converter
        #- id: p_nom_extendable # Not used in the Gems model: p_nom_min and p_nom_max fix p_nom for non-extendable links
        #- id: p_nom_set # Handled by converter: p_nom_min = p_nom_max = p_nom_set for extendable links
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        #- id: p_set # Not instantiated: fixed dispatch is rejected by the converter
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          # Periodized cost: capital_cost + fom_cost, or annuity(overnight_cost, discount_rate, lifetime) + fom_cost
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        #- id: marginal_cost_quadratic # Non-linear: rejected by the converter
        #- id: committable, start_up_cost, shut_down_cost, stand_by_cost, min_up_time, min_down_time, up_time_before,
        #      down_time_before, ramp_limit_start_up, ramp_limit_shut_down # Unit commitment (MILP): rejected by the converter
        #- id: ramp_limit_up, ramp_limit_down # See link_ramp
        #- id: delay # Delayed delivery: rejected by the converter
        #- id: terrain_factor # Defined in PyPSA schema but never read by the optimizer
        - id: length
          # Link length [km]. Only used by transmission_volume_expansion_limit global constraints.
          time-dependent: false
          scenario-dependent: false
        - id: objective_weighting
          # Source: PyPSA n.snapshot_weightings.objective
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p0
      ports:
        - id: p0_port
          type: flow
        - id: p1_port
          type: flow
        - id: capacity_port
          type: capacity
        - id: expansion_volume_port
          type: capacity
        - id: expansion_cost_port
          type: capacity
      port-field-definitions:
        - port: p0_port
          field: power
          definition: -p0
        - port: p1_port
          field: power
          definition: efficiency * p0
        - port: capacity_port
          field: value
          definition: p_nom
        - port: expansion_volume_port
          field: value
          definition: length * p_nom
        - port: expansion_cost_port
          field: value
          definition: capital_cost * p_nom
      constraints:
        - id: p0_upper
          expression: p0 <= p_max_pu * p_nom
        - id: p0_lower
          expression: p0 >= p_min_pu * p_nom
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(objective_weighting * marginal_cost * p0)

    - id: link_ramp
      #Model for PyPSA 2-port link with ramp limits (ramp_limit_up and/or ramp_limit_down set). See generator_ramp.
      parameters:
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        - id: length
          time-dependent: false
          scenario-dependent: false
        - id: objective_weighting
          time-dependent: true
          scenario-dependent: false
        - id: ramp_limit_up
          time-dependent: true
          scenario-dependent: true
        - id: ramp_limit_down
          time-dependent: true
          scenario-dependent: true
        - id: ramp_up_active
          time-dependent: true
          scenario-dependent: true
        - id: ramp_down_active
          time-dependent: true
          scenario-dependent: true
        - id: p_init
          time-dependent: false
          scenario-dependent: true
        - id: p_init_active
          time-dependent: false
          scenario-dependent: true
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p0
      ports:
        - id: p0_port
          type: flow
        - id: p1_port
          type: flow
        - id: capacity_port
          type: capacity
        - id: expansion_volume_port
          type: capacity
        - id: expansion_cost_port
          type: capacity
      port-field-definitions:
        - port: p0_port
          field: power
          definition: -p0
        - port: p1_port
          field: power
          definition: efficiency * p0
        - port: capacity_port
          field: value
          definition: p_nom
        - port: expansion_volume_port
          field: value
          definition: length * p_nom
        - port: expansion_cost_port
          field: value
          definition: capital_cost * p_nom
      constraints:
        - id: p0_upper
          expression: p0 <= p_max_pu * p_nom
        - id: p0_lower
          expression: p0 >= p_min_pu * p_nom
        - id: ramp_up
          expression: ramp_up_active * (p0 - p0[t-1]) <= ramp_limit_up * p_nom
        - id: ramp_down
          expression: ramp_down_active * (p0 - p0[t-1]) >= -ramp_limit_down * p_nom
        - id: ramp_up_initial
          expression: p_init_active * ramp_up_active[0] * (p0[0] - p_init) <= ramp_limit_up[0] * p_nom
        - id: ramp_down_initial
          expression: p_init_active * ramp_down_active[0] * (p0[0] - p_init) >= -ramp_limit_down[0] * p_nom
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(objective_weighting * marginal_cost * p0)

    - id: link_multiport
      #Model for PyPSA link with up to five buses (bus0 -> bus1, bus2, bus3, bus4), and for PyPSA Process.
      #The power injected into bus i is rate_i * p0, with:
      #  - Link: rate0 = -1, efficiency = efficiency (bus1), efficiency2..efficiency4 (bus2..bus4)
      #  - Process: rate0 = rate0, efficiency = rate1, efficiency2..efficiency4 = rate2..rate4
      #A port without a bus is left unconnected and its coefficient is set to 0.
      parameters:
        - id: rate0
          time-dependent: true
          scenario-dependent: true
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        - id: efficiency2
          time-dependent: true
          scenario-dependent: true
        - id: efficiency3
          time-dependent: true
          scenario-dependent: true
        - id: efficiency4
          time-dependent: true
          scenario-dependent: true
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        - id: length
          time-dependent: false
          scenario-dependent: false
        - id: objective_weighting
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: p_nom
          time-dependent: false
          scenario-dependent: false
          lower-bound: p_nom_min
          upper-bound: p_nom_max
        - id: p0
      ports:
        - id: p0_port
          type: flow
        - id: p1_port
          type: flow
        - id: p2_port
          type: flow
        - id: p3_port
          type: flow
        - id: p4_port
          type: flow
        - id: capacity_port
          type: capacity
        - id: expansion_volume_port
          type: capacity
        - id: expansion_cost_port
          type: capacity
      port-field-definitions:
        - port: p0_port
          field: power
          definition: rate0 * p0
        - port: p1_port
          field: power
          definition: efficiency * p0
        - port: p2_port
          field: power
          definition: efficiency2 * p0
        - port: p3_port
          field: power
          definition: efficiency3 * p0
        - port: p4_port
          field: power
          definition: efficiency4 * p0
        - port: capacity_port
          field: value
          definition: p_nom
        - port: expansion_volume_port
          field: value
          definition: length * p_nom
        - port: expansion_cost_port
          field: value
          definition: capital_cost * p_nom
      constraints:
        - id: p0_upper
          expression: p0 <= p_max_pu * p_nom
        - id: p0_lower
          expression: p0 >= p_min_pu * p_nom
      objective-contributions:
        - id: capital_objective
          expression: capital_cost * p_nom
        - id: operational_objective
          expression: sum(objective_weighting * marginal_cost * p0)

    - id: link_multiport_ramp
      #Model for PyPSA multi-port link or Process with ramp limits. See link_multiport and generator_ramp.
      parameters:
        - id: rate0
          time-dependent: true
          scenario-dependent: true
        - id: efficiency
          time-dependent: true
          scenario-dependent: true
        - id: efficiency2
          time-dependent: true
          scenario-dependent: true
        - id: efficiency3
          time-dependent: true
          scenario-dependent: true
        - id: efficiency4
          time-dependent: true
          scenario-dependent: true
        - id: p_nom_min
          time-dependent: false
          scenario-dependent: false
        - id: p_nom_max
          time-dependent: false
          scenario-dependent: false
        - id: p_min_pu
          time-dependent: true
          scenario-dependent: true
        - id: p_max_pu
          time-dependent: true
          scenario-dependent: true
        - id: capital_cost
          time-dependent: false
          scenario-dependent: false
        - id: marginal_cost
          time-dependent: true
          scenario-dependent: true
        - id: length
