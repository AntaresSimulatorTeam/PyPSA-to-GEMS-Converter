        - id: ramp_limit_down
          time-dependent: true
          scenario-dependent: true
        - id: ramp_up_active
          time-dependent: true
          scenario-dependent: true
        - id: ramp_down_active
          time-dependent: true
          scenario-dependent: true
        - id: p_init
          time-dependent: false
