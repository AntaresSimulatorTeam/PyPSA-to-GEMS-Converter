[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsa-to-gems-converter"
version = "0.1.0"
description = "Convert PyPSA networks into GEMS study folders for modelling and simulation."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "AUTHORS.txt"]
authors = [
    { name = "Dusan Paripovic @dusanparipovic" },
    { name = "Nikola Ilic @nikolaredstork" },
    { name = "Thomas Bittar @tbittar" },
    { name = "Antoine Oustry @aoustry"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.3",
    "polars>=0.20.0",
    "pyarrow",
    "pypsa==1.3.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.12.5",
    "antares-craft==0.17.1",
]
classifiers = [
    # Classifiers here: https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/AntaresSimulatorTeam/PyPSA-to-GEMS-Converter"
"Bug Tracker" = "https://github.com/AntaresSimulatorTeam/PyPSA-to-GEMS-Converter/issues"

[project.scripts]
pypsa-to-gems = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.1",
    "pytest-xdist>=3.8.0",
    "highspy>=1.5.0",
    "ruff>=0.9.6",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
    "gemspy",
    "ipykernel>=7.3.0",
]

[tool.uv.sources]
# Pinned to a commit (not the mutable branch name) on GemsPy PR #298
# ("Generate per-(scenario, week-block) Benders subproblems"), which the full-GEMS path
# (PyPSAStudyConverter(full_gems=True) / tests/local_benchmark/xpansion_benchmark.py) needs:
# the PyPI release (gemspy==0.1.3) predates it and doesn't split Benders subproblems per
# week-block. Bump this rev (and re-run `uv sync --group dev`) once the PR moves or merges.
gemspy = { git = "https://github.com/AntaresSimulatorTeam/GemsPy.git", rev = "76c13f8922382cbaa181bfa3c91404925ad85974" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "resources"]
namespaces = true

[tool.setuptools.package-data]
resources = ["optim-config.yml", "pypsa_models/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.ipynb"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "resources", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*.ipynb" = ["E402"]
"src/pypsa_preprocessor.py" = ["E712"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
files = "src"
strict = true
plugins = ["pydantic.mypy"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["src.models", "src.models.gems_system_yml_schema", "src.models.modeler_parameter_yml_schema"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.e2e.end_2_end_tests", "tests.e2e.test_hybrid_study_comparison", "tests.local_benchmark.benchmark"]
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = ["pypsa.*", "pandas.*", "pydantic.*", "pytest.*", "gems_craft.*", "gems_runner.*", "gems_craft_hybrid.*", "antares.*", "highspy.*"]
ignore_missing_imports = true
