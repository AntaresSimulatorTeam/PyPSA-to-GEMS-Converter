name: Notify GEMS — PyPSA Models Library Update

on:
  push:
    branches: [main]
    paths:
      - 'dependencies.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read library version
        id: version
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('dependencies.json')); print(d['pypsa_models_library_version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Library version: $VERSION"

      - name: Create issue in GEMS repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GEMS_REPO_PAT }}
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const converterRepo = context.repo.repo;
            const converterOwner = context.repo.owner;
            const title = `[PYPSA MODELS] New library version: v${version}`;

            const existing = await github.rest.issues.listForRepo({
              owner: converterOwner,
              repo: 'GEMS',
              state: 'open',
            });

            const duplicate = existing.data.find(i => i.title.includes(`v${version}`));
            if (duplicate) {
              console.log(`Issue already exists: #${duplicate.number} — skipping.`);
              return;
            }

            const body = [
              `PyPSA models library updated to \`v${version}\` in [${converterRepo}](https://github.com/${converterOwner}/${converterRepo}).`,
              '',
              `Changelog: https://github.com/${converterOwner}/${converterRepo}/blob/main/resources/pypsa_models/CHANGELOG-pypsa_models_library.md`,
              '',
              'Update `libraries/pypsa_models.yml` in GEMS accordingly.',
            ].join('\n');

            const result = await github.rest.issues.create({
              owner: converterOwner,
              repo: 'GEMS',
              title: title,
              body: body,
              labels: ['pypsa-models-update'],
            });

            console.log(`Issue created: #${result.data.number} — ${result.data.html_url}`);
