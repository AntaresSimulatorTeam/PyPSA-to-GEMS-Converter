name: Check PyPSA Update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.compare.outputs.update }}
      latest_version: ${{ steps.latest.outputs.version }}
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      antares_version: ${{ steps.antares.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read current PyPSA version
        id: current
        run: |
          VERSION=$(grep '^pypsa==' requirements.txt | cut -d'=' -f3 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Fetch latest PyPSA release from PyPI
        id: latest
        run: |
          RESPONSE=$(curl -sf "https://pypi.org/pypi/pypsa/json")

          if [ -z "$RESPONSE" ]; then
            echo "ERROR: Could not fetch PyPSA info from PyPI"
            exit 1
          fi

          LATEST=$(echo "$RESPONSE" | jq -r '.info.version')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: Could not parse latest PyPSA version"
            exit 1
          fi

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest PyPSA version: $LATEST"

      - name: Read current Antares version
        id: antares
        run: |
          VERSION=$(grep 'ANTARES_SIMULATOR_VERSION' versions/antares-simulator.txt | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          echo "Current: $CURRENT  |  Latest: $LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $LATEST"
          fi

      - name: Create GitHub Issue
        id: create_issue
        if: steps.compare.outputs.update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.latest.outputs.version }}';
            const current = '${{ steps.current.outputs.version }}';
            const title = `[PYPSA UPDATE] New release: v${latest}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const duplicate = existing.data.find(i => i.title.includes(`v${latest}`));
            if (duplicate) {
              console.log(`Issue already exists: #${duplicate.number} - skipping.`);
              core.setOutput('issue_number', String(duplicate.number));
              return;
            }

            const body = [
              '> This issue was automatically created by the `check-pypsa-update` workflow.',
              '',
              '## New Version Detected',
              '',
              '| | |',
              '|---|---|',
              `| **Previous version** | \`${current}\` |`,
              `| **New version** | \`${latest}\` |`,
              `| **PyPI page** | https://pypi.org/project/pypsa/${latest}/ |`,
              `| **Changelog** | https://pypsa.readthedocs.io/en/latest/release_notes.html |`,
              '',
              '## Release Notes Summary',
              '',
              '_Paste relevant changelog entries here before triaging._',
              '',
              '## Triage',
              '',
              '- [ ] PyPSA changelog reviewed',
              '- [ ] P2G-03 issue opened (if API changes, new components, or solver behaviour changes affect the converter)',
              '- [ ] No action needed (if release has no impact on the converter)',
              '',
              '---',
              '',
              '_E2E test results against this version will be posted below by the workflow._',
            ].join('\n');

            const result = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pypsa-update'],
            });

            core.setOutput('issue_number', String(result.data.number));
            console.log(`Issue created: #${result.data.number} - ${result.data.html_url}`);

  e2e-new-pypsa-version:
    name: E2E Tests against PyPSA v${{ needs.check-update.outputs.latest_version }}
    needs: check-update
    if: needs.check-update.outputs.update == 'true'
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      antares_version: ${{ needs.check-update.outputs.antares_version }}
      pypsa_version: ${{ needs.check-update.outputs.latest_version }}
      artifact_name: e2e-failures-pypsa-${{ needs.check-update.outputs.latest_version }}

  post-results:
    name: Post E2E results to issue
    runs-on: ubuntu-22.04
    needs: [check-update, e2e-new-pypsa-version]
    if: always() && needs.check-update.outputs.update == 'true'

    steps:
      - name: Post results to issue
        uses: actions/github-script@v9
        with:
          script: |
            const outcome = '${{ needs.e2e-new-pypsa-version.outputs.test_outcome }}';
            const version = '${{ needs.check-update.outputs.latest_version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const icon = outcome === 'success' ? '✅' : '❌';
            const status = outcome === 'success' ? 'passed' : 'failed';

            const body = [
              `## E2E Test Results — PyPSA v${version}`,
              '',
              `${icon} E2E tests **${status}** against PyPSA v${version}.`,
              '',
              `[View full run](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.check-update.outputs.issue_number }}'),
              body: body,
            });
