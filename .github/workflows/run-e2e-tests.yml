name: Run E2E Tests (reusable)

on:
  workflow_call:
    inputs:
      antares_version:
        description: 'Antares Simulator version to test against'
        required: true
        type: string
      antares_xpansion_version:
        description: 'Antares Xpansion version to test against'
        required: true
        type: string
      pypsa_version:
        description: 'PyPSA version to override the pinned version (leave empty to use pinned)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Name for the uploaded artifact on failure'
        required: false
        type: string
        default: 'e2e-test-failures'
    outputs:
      test_outcome:
        description: 'Outcome of the E2E test run (success or failure)'
        value: ${{ jobs.e2e.outputs.test_outcome }}

jobs:
  e2e:
    name: E2E Tests (Antares v${{ inputs.antares_version }})
    runs-on: ubuntu-22.04
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log resolved versions
        run: |
          echo "### Resolved dependency versions" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Antares Simulator | ${{ inputs.antares_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Antares Xpansion  | ${{ inputs.antares_xpansion_version }} |" >> "$GITHUB_STEP_SUMMARY"
          PYPSA_VERSION="${{ inputs.pypsa_version }}"
          if [ -n "${PYPSA_VERSION}" ]; then
            echo "| PyPSA (override)  | ${PYPSA_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo ""
          echo "Antares Simulator : ${{ inputs.antares_version }}"
          echo "Antares Xpansion  : ${{ inputs.antares_xpansion_version }}"
          echo "PyPSA override    : ${PYPSA_VERSION:-<none>}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Override PyPSA version
        if: inputs.pypsa_version != ''
        run: uv pip install "pypsa==${{ inputs.pypsa_version }}"

      - name: Log installed Python packages
        run: |
          echo "--- Python environment ---"
          uv run python --version
          uv run pip show pypsa antares-solver 2>/dev/null || true
          echo "--- Key packages ---"
          uv run pip list | grep -iE "pypsa|antares|gems|linopy|pandas|numpy" || true

      - name: Download Antares release
        run: |
          VERSION="${{ inputs.antares_version }}"
          ARCHIVE="antares-${VERSION}-Ubuntu-22.04.tar.gz"
          URL="https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases/download/v${VERSION}/${ARCHIVE}"
          echo "Downloading Antares v${VERSION}..."
          echo "URL: ${URL}"
          curl -L -f -o "${ARCHIVE}" "${URL}"
          echo "Download successful. File size: $(ls -lh "${ARCHIVE}" | awk '{print $5}')"

      - name: Extract Antares binaries
        run: |
          VERSION="${{ inputs.antares_version }}"
          tar -xzf "antares-${VERSION}-Ubuntu-22.04.tar.gz"
          echo "Antares binaries:"
          ls -lh "antares-${VERSION}-Ubuntu-22.04/bin/" 2>/dev/null || ls -lh "antares-${VERSION}-Ubuntu-22.04/" 2>/dev/null || true

      - name: Download Antares Xpansion release
        run: |
          VERSION="${{ inputs.antares_xpansion_version }}"
          # Release tag may include a prerelease suffix (e.g. 1.9.0-rc1), but the
          # archive filename only uses the base version (e.g. 1.9.0).
          BASE_VERSION="${VERSION%%-rc*}"
          BASE_VERSION="${BASE_VERSION%%-alpha*}"
          BASE_VERSION="${BASE_VERSION%%-beta*}"
          ARCHIVE="antaresXpansion-${BASE_VERSION}-ubuntu-22.04.tar.gz"
          URL="https://github.com/AntaresSimulatorTeam/antares-xpansion/releases/download/v${VERSION}/${ARCHIVE}"
          echo "Downloading Antares Xpansion v${VERSION} (archive: ${ARCHIVE})..."
          echo "URL: ${URL}"
          curl -L -f -o "${ARCHIVE}" "${URL}"
          echo "Download successful. File size: $(ls -lh "${ARCHIVE}" | awk '{print $5}')"

      - name: Extract Antares Xpansion binaries
        run: |
          VERSION="${{ inputs.antares_xpansion_version }}"
          BASE_VERSION="${VERSION%%-rc*}"
          BASE_VERSION="${BASE_VERSION%%-alpha*}"
          BASE_VERSION="${BASE_VERSION%%-beta*}"
          tar -xzf "antaresXpansion-${BASE_VERSION}-ubuntu-22.04.tar.gz"
          echo "Xpansion binaries:"
          ls -lh "antaresXpansion-${BASE_VERSION}-ubuntu-22.04/bin/" 2>/dev/null || ls -lh "antaresXpansion-${BASE_VERSION}-ubuntu-22.04/" 2>/dev/null || true

      - name: Verify binary paths
        run: |
          ANTARES_VERSION="${{ inputs.antares_version }}"
          XPANSION_VERSION="${{ inputs.antares_xpansion_version }}"
          BASE_XPANSION="${XPANSION_VERSION%%-rc*}"
          BASE_XPANSION="${BASE_XPANSION%%-alpha*}"
          BASE_XPANSION="${BASE_XPANSION%%-beta*}"
          ANTARES_MODELER="antares-${ANTARES_VERSION}-Ubuntu-22.04/bin/antares-modeler"
          ANTARES_PG="antares-${ANTARES_VERSION}-Ubuntu-22.04/bin/antares-problem-generator"
          BENDERS="antaresXpansion-${BASE_XPANSION}-ubuntu-22.04/bin/benders"
          for BIN in "${ANTARES_MODELER}" "${ANTARES_PG}" "${BENDERS}"; do
            if [ -f "${BIN}" ]; then
              echo "OK  ${BIN} ($(${BIN} --version 2>&1 | head -1 || echo 'version unavailable'))"
            else
              echo "MISSING  ${BIN}"
            fi
          done

      - name: Run end-to-end tests
        id: run_tests
        run: |
          uv run pytest \
            tests/e2e/end_2_end_tests.py \
            tests/e2e_2_stage_stochastic/test_2_stage_stochastic_study.py \
            -v -s --log-cli-level=INFO --tb=short -rA
        continue-on-error: true

      - name: Upload test artifacts on failure
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            tmp/
            **/*.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          ANTARES_VERSION="${{ inputs.antares_version }}"
          XPANSION_VERSION="${{ inputs.antares_xpansion_version }}"
          BASE_XPANSION="${XPANSION_VERSION%%-rc*}"
          BASE_XPANSION="${BASE_XPANSION%%-alpha*}"
          BASE_XPANSION="${BASE_XPANSION%%-beta*}"
          rm -f "antares-${ANTARES_VERSION}-Ubuntu-22.04.tar.gz"
          rm -rf "antares-${ANTARES_VERSION}-Ubuntu-22.04"
          rm -f "antaresXpansion-${BASE_XPANSION}-ubuntu-22.04.tar.gz"
          rm -rf "antaresXpansion-${BASE_XPANSION}-ubuntu-22.04"

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
