name: Run E2E Tests (reusable)

on:
  workflow_call:
    inputs:
      antares_version:
        description: 'Antares Simulator version to test against'
        required: true
        type: string
      antares_xpansion_version:
        description: 'Antares Xpansion version to test against'
        required: true
        type: string
      pypsa_version:
        description: 'PyPSA version to override the pinned version (leave empty to use pinned)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Name for the uploaded artifact on failure'
        required: false
        type: string
        default: 'e2e-test-failures'
    outputs:
      test_outcome:
        description: 'Outcome of the E2E test run (success or failure)'
        value: ${{ jobs.e2e.outputs.test_outcome }}

jobs:
  e2e:
    name: E2E Tests (Antares v${{ inputs.antares_version }})
    runs-on: ubuntu-22.04
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi3 openmpi-bin coinor-cbc

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Override PyPSA version
        if: inputs.pypsa_version != ''
        run: uv pip install "pypsa==${{ inputs.pypsa_version }}"

      - name: Download Antares release
        run: |
          VERSION="${{ inputs.antares_version }}"
          curl -L -f -o "antares-${VERSION}-Ubuntu-22.04.tar.gz" \
            "https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases/download/v${VERSION}/antares-${VERSION}-Ubuntu-22.04.tar.gz"

      - name: Extract Antares binaries
        run: |
          VERSION="${{ inputs.antares_version }}"
          tar -xzf "antares-${VERSION}-Ubuntu-22.04.tar.gz"

      - name: Download Antares Xpansion release
        run: |
          VERSION="${{ inputs.antares_xpansion_version }}"
          BASE_VERSION="${VERSION%%-rc*}"
          curl -L -f -o "antaresXpansion-${BASE_VERSION}-ubuntu-22.04.tar.gz" \
            "https://github.com/AntaresSimulatorTeam/antares-xpansion/releases/download/v${VERSION}/antaresXpansion-${BASE_VERSION}-ubuntu-22.04.tar.gz"

      - name: Extract Antares Xpansion binaries
        run: |
          VERSION="${{ inputs.antares_xpansion_version }}"
          BASE_VERSION="${VERSION%%-rc*}"
          tar -xzf "antaresXpansion-${BASE_VERSION}-ubuntu-22.04.tar.gz"

      - name: Run end-to-end tests
        id: run_tests
        run: |
          uv run pytest \
            tests/e2e/end_2_end_tests.py \
            tests/e2e_2_stage_stochastic/test_2_stage_stochastic_study.py \
            -v --tb=short -rA
        continue-on-error: true

      - name: Upload test artifacts on failure
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            tmp/
            **/*.log
            e2e-results.xml
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          ANTARES_VERSION="${{ inputs.antares_version }}"
          XPANSION_VERSION="${{ inputs.antares_xpansion_version }}"
          BASE_XPANSION="${XPANSION_VERSION%%-rc*}"
          BASE_XPANSION="${BASE_XPANSION%%-alpha*}"
          BASE_XPANSION="${BASE_XPANSION%%-beta*}"
          rm -f "antares-${ANTARES_VERSION}-Ubuntu-22.04.tar.gz"
          rm -rf "antares-${ANTARES_VERSION}-Ubuntu-22.04"
          rm -f "antaresXpansion-${BASE_XPANSION}-ubuntu-22.04.tar.gz"
          rm -rf "antaresXpansion-${BASE_XPANSION}-ubuntu-22.04"

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
