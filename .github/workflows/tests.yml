name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    outputs:
      antares_version: ${{ steps.read_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        id: run_unit_tests
        run: |
          pytest -n auto tests/unit_tests/ -v -s --log-cli-level=INFO --tb=short -rA

      - name: Resolve Antares version for downstream E2E job
        id: read_version
        run: |
          VERSION=$(jq -r '.antares_version' dependencies.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failures
          path: |
            **/*.log
          retention-days: 7

  e2e-tests:
    name: End-to-End Tests
    needs: unit-tests
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      antares_version: ${{ needs.unit-tests.outputs.antares_version }}
      artifact_name: e2e-test-failures
