name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    outputs:
      antares_version: ${{ steps.read_versions.outputs.antares_version }}
      antares_xpansion_version: ${{ steps.read_versions.outputs.antares_xpansion_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests
        id: run_unit_tests
        run: |
          uv run pytest -n auto tests/unit_tests/ -v -s --log-cli-level=INFO --tb=short -rA

      - name: Resolve Antares versions for downstream E2E job
        id: read_versions
        run: |
          ANTARES_VERSION=$(jq -r '.antares_version' dependencies.json)
          XPANSION_VERSION=$(jq -r '.antares_xpansion_version' dependencies.json)
          echo "antares_version=$ANTARES_VERSION" >> "$GITHUB_OUTPUT"
          echo "antares_xpansion_version=$XPANSION_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failures
          path: |
            **/*.log
          retention-days: 7

  e2e-tests:
    name: End-to-End Tests
    needs: unit-tests
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      antares_version: ${{ needs.unit-tests.outputs.antares_version }}
      antares_xpansion_version: ${{ needs.unit-tests.outputs.antares_xpansion_version }}
      artifact_name: e2e-test-failures
